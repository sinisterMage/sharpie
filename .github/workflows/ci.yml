# Every push and every pull request: build sharpie, and run its cases.
#
# **The compiler is downloaded, not built.** sharpie is written in W#, so CI
# needs a W# toolchain -- and the honest way to get one is the same way a user
# does: take the published release. Building the compiler from source here
# would test a `wsharp` nobody has, and would put a Rust build in front of
# every push to a repository with no Rust in it.
#
# That makes this a standing check on something worth checking: sharpie has to
# keep compiling with a *released* compiler, not only with whatever is in a
# WSharp working tree. `.github/workflows/release.yml` bootstraps the same way,
# so a green CI run means the release will get that far too.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Pinned rather than `latest`, so that a WSharp release cannot change what
  # this repository builds with without a commit here saying so. Bumping it is
  # a deliberate act and shows up in the history as one. 0.1.3 was the first W#
  # with a Windows build and 0.1.4 is the first where one *works*: its collector
  # found no roots on that platform, so every W# program there crashed as soon
  # as it allocated enough to collect. The third arm below is why that was
  # found, and this pin is why it stays found.
  WSHARP_VERSION: "0.1.4"

jobs:
  check:
    name: ${{ matrix.triple }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            exe: ""
            cc: cc
            sha: sha256sum
          - os: macos-latest
            triple: aarch64-apple-darwin
            exe: ""
            cc: cc
            # macOS has no `sha256sum`. `shasum -a 256` writes the same
            # `<hex>  <name>` line, which is all anything reading it needs.
            sha: shasum -a 256
          # **Here as well as in `release.yml`, and that is the point of this
          # file.** The header above says a green run means the release will get
          # that far too; a Windows arm that only existed in the release
          # workflow would break that promise on the platform most likely to
          # break, and would do it at a tag rather than at a pull request.
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            exe: ".exe"
            # `wsharp` drives the link itself and passes `-o`, which `cl.exe`
            # does not understand. `release.yml` has the longer note.
            cc: clang
            sha: sha256sum
    defaults:
      run:
        shell: bash
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4

      # Git Bash's coreutils `link` comes before MSVC's linker on `PATH`, and
      # clang resolves the name rather than the program. `release.yml` has the
      # longer note; the fix is the same one.
      - name: Remove the link.exe that is not a linker
        if: runner.os == 'Windows'
        run: rm -f "/c/Program Files/Git/usr/bin/link.exe"

      # `LIB` and `INCLUDE`, without which the link cannot resolve `kernel32`
      # and the seven others `wsharp` names.
      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # The toolchain, fetched and checked. Unpacked into `.wsharp/` rather
      # than a temporary directory so that the path below is stable and a
      # failed step can be read without guessing where anything went.
      - name: Bootstrap the W# toolchain
        run: |
          set -eu
          stage="wsharp-${WSHARP_VERSION}-${{ matrix.triple }}"
          base="https://github.com/sinisterMage/WSharp/releases/download/v${WSHARP_VERSION}"
          mkdir -p .wsharp
          curl -fsSL --proto '=https' --tlsv1.2 -o ".wsharp/${stage}.tar.gz" "${base}/${stage}.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o ".wsharp/${stage}.tar.gz.sha256" "${base}/${stage}.tar.gz.sha256"
          cd .wsharp
          # The published digest is the first field; the name beside it is
          # whatever the machine that wrote it called the file.
          want=$(cut -d' ' -f1 < "${stage}.tar.gz.sha256")
          got=$(${{ matrix.sha }} "${stage}.tar.gz" | cut -d' ' -f1)
          [ "$want" = "$got" ] || { echo "the toolchain is not what was published" >&2; exit 1; }
          tar -xzf "${stage}.tar.gz"
          echo "WSHARP=${PWD}/${stage}/wsharp${{ matrix.exe }}" >> "$GITHUB_ENV"

      - name: Versions
        run: |
          "$WSHARP" --version
          "$CC" --version | head -1

      # `WSHARP` is what `tests/run.sh` reads, and the whole reason it takes an
      # environment variable rather than looking in one place.
      #
      # **MSYS rewrites an environment variable that looks like a path before a
      # native program sees it.** A case says `// env: SHARPIE_HOME=/tmp/sharpie-case`
      # and asserts the paths built from it, and what `wsharp.exe` was handed was
      # `C:/Users/RUNNER~1/AppData/Local/Temp/sharpie-case` -- `/tmp` is an MSYS
      # mount, so it was translated on the way out of `env`. Every expected line
      # then drifted, and the failure read like a bug in `home.ws` rather than in
      # the shell that launched it.
      #
      # Here rather than on the job, because the smoke step below *wants* that
      # translation: it hands sharpie a `$PWD` that only MSYS can spell. All
      # three names, because Git Bash and MSYS2 spell the switch differently and
      # arguments and environment are separate switches. Harmless where there is
      # no MSYS to tell.
      - name: Test
        env:
          MSYS_NO_PATHCONV: "1"
          MSYS2_ARG_CONV_EXCL: "*"
          MSYS2_ENV_CONV_EXCL: "*"
        run: ./tests/run.sh

      - name: Build
        run: |
          "$WSHARP" build src/main.ws -o "sharpie${{ matrix.exe }}"

      # A binary that builds and then cannot answer `help` has not been built,
      # it has been linked. This is the cheapest thing that tells them apart,
      # and it runs the proxy path in `src/proxy.ws` on the way past -- the
      # binary has to work out that it was invoked as `sharpie` and not as a
      # compiler before it can print anything at all. On Windows it has to take
      # the `.exe` off its own name to do that.
      - name: Smoke
        run: |
          set -eu
          exe="${{ matrix.exe }}"
          "./sharpie${exe}" version
          "./sharpie${exe}" help > /dev/null

          # **`init` is run from where `install.sh` puts the binary, not from
          # the build directory, and that difference is the whole test.** `init`
          # writes three proxies, and one of them is the file it is running
          # from -- a running executable cannot be opened for writing, so doing
          # it in place fails with `ETXTBSY` and leaves an installation with no
          # `wsharp` in it. Running `./sharpie init` from here instead would
          # pass while every real install broke, which is exactly what happened.
          #
          # **`pwd -W` on Windows, because `$PWD` is not a path sharpie can
          # read.** Git Bash spells this directory `/d/a/sharpie/sharpie`, which
          # is an MSYS mount and means nothing to a native program:
          # `sharpie.exe` would read the leading `/` as the root of the current
          # drive and make its home at `D:\d\a\...`, while the `test -x` lines
          # below looked at `D:\a\...` and found nothing.
          #
          # MSYS *would* translate `SHARPIE_HOME` here, and correctly -- which is
          # why the switches that turn that off are on the test step above and
          # not on the job. This step does not rely on it either way: what it
          # hands over is already a Windows path.
          here=$PWD
          [ -z "${exe}" ] || here=$(pwd -W)
          home="${here}/.sharpie-ci"
          mkdir -p "${home}/bin"
          cp "sharpie${exe}" "${home}/bin/sharpie${exe}"
          SHARPIE_HOME="$home" "${home}/bin/sharpie${exe}" init
          test -x "${home}/bin/wsharp${exe}"
          test -x "${home}/bin/ingot${exe}"

          # Again, because `init` is meant to be idempotent -- that is how a
          # sharpie upgrade refreshes its own proxies. On Windows the second run
          # is a different test rather than the same one twice: `rename` there
          # cannot replace a *running* image, so this is the line that says
          # whether the fallback in `proxy_at` works.
          SHARPIE_HOME="$home" "${home}/bin/sharpie${exe}" init > /dev/null
          test -x "${home}/bin/wsharp${exe}"
          SHARPIE_HOME="$home" "${home}/bin/sharpie${exe}" version
