# Temporary. Delete once the Windows failure in CI run 34352577662 is understood.
#
# Six of the eight cases died there with exit 139 -- an MSYS bash reporting
# `STATUS_STACK_OVERFLOW` -- and two of them managed to print Rust's "thread
# 'main' has overflowed its stack" on the way down. `targz.ws` is among the
# dead and nothing in this repository's Windows work touches it, so the fault
# is below sharpie.
#
# The hypothesis is the *main thread's stack*. `parser.rs` says its nesting
# limit is "sized for the compiler's main thread" and that a debug parser at
# that limit "does not fit in the test harness's 2 MiB threads" -- and Windows
# gives a main thread 1 MiB, where Linux gives 8. That would make `wsharp.exe`
# the one place with less room than the tests it passes.
#
# This asks the machine rather than the hypothesis. Every step reports its own
# status and carries on, because the interesting output is the whole table.

name: Windows diagnosis

on:
  # A pull request, because `workflow_dispatch` can only be aimed at a workflow
  # that is already on the default branch -- and this one deliberately is not.
  pull_request:
  workflow_dispatch:

env:
  WSHARP_VERSION: "0.1.3"

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4

      - name: Remove the link.exe that is not a linker
        run: rm -f "/c/Program Files/Git/usr/bin/link.exe"

      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap the W# toolchain
        run: |
          set -eu
          stage="wsharp-${WSHARP_VERSION}-x86_64-pc-windows-msvc"
          base="https://github.com/sinisterMage/WSharp/releases/download/v${WSHARP_VERSION}"
          mkdir -p .wsharp
          curl -fsSL -o ".wsharp/${stage}.tar.gz" "${base}/${stage}.tar.gz"
          cd .wsharp
          tar -xzf "${stage}.tar.gz"
          echo "WSHARP=${PWD}/${stage}/wsharp.exe" >> "$GITHUB_ENV"

      # Which half is it in? `check` parses and type-checks and does not run;
      # `run` does both and then executes. A `check` that dies is a compiler
      # that cannot fit, and a `check` that lives with a `run` that dies is the
      # runtime or the collector.
      - name: check, run and build, each reporting for itself
        run: |
          # **`set +e` first, and it is load-bearing.** The runner starts this
          # shell with `-e`, so the first segfault ended the previous attempt
          # three lines in and took the rest of the table with it. The whole
          # point here is to keep going past a crash.
          set +e
          set -u
          say() { printf '\n=== %s ===\n' "$*"; }
          try() {
              label=$1
              shift
              say "$label"
              "$@" > out.txt 2> err.txt
              printf 'exit %s\n' "$?"
              printf -- '--- stdout (last 10) ---\n'
              tail -10 out.txt
              printf -- '--- stderr (last 10) ---\n'
              tail -10 err.txt
          }

          "$WSHARP" --version

          # Round one established this much: `check tests/home.ws` exits 0 and
          # `run` segfaults, so the compiler is not where this dies. What is
          # left is the runtime and the collector -- and the collector is the
          # part W# 0.1.3 had just rewritten for Windows, because the root walk
          # followed the `rbp` chain across Rust frames that Win64 does not
          # promise. `WSHARP_GC_TRACE` prints every frame that walk visits, so a
          # walk that is looping says so in its own words.
          try "run tests/home.ws" "$WSHARP" run tests/home.ws
          try "run tests/home.ws, GC stats" env WSHARP_GC_STATS=1 "$WSHARP" run tests/home.ws

          say "run tests/home.ws, GC trace -- first 40 frames and last 40"
          env WSHARP_GC_TRACE=1 "$WSHARP" run tests/home.ws > trace-out.txt 2> trace-err.txt
          printf 'exit %s\n' "$?"
          printf 'trace lines: %s\n' "$(wc -l < trace-err.txt)"
          head -40 trace-err.txt
          printf -- '--- ... ---\n'
          tail -40 trace-err.txt

          # Reached `main` and printed a line before dying, so whatever this is
          # happens partway through rather than at startup.
          try "run tests/targz.ws" "$WSHARP" run tests/targz.ws

          # The thing the release actually needs. `build` runs no W# code, so
          # if the fault is in the runtime this should live -- and a Windows
          # sharpie could still be published even while its cases cannot run
          # here.
          try "check src/main.ws" "$WSHARP" check src/main.ws
          try "build src/main.ws" "$WSHARP" build src/main.ws -o sharpie.exe

          say "did a binary come out, and does it run?"
          ls -l sharpie.exe || echo "no sharpie.exe"
          ./sharpie.exe version; printf 'exit %s\n' "$?"
          ./sharpie.exe help > /dev/null; printf 'help exit %s\n' "$?"
          SHARPIE_HOME="$(pwd -W)/.sharpie-probe" ./sharpie.exe init; printf 'init exit %s\n' "$?"
