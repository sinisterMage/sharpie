# Publishing a tagged release.
#
# Cutting one is `git tag v0.1.0 && git push origin v0.1.0`. Everything else is
# here.
#
# **The matrix is four targets, and it is not an arbitrary four.** sharpie is
# built by `wsharp`, so it can only be built where a `wsharp` has been
# published -- the matrix below is exactly WSharp's, and cannot get ahead of it.
# There is no aarch64 Linux arm for that reason and no other: when WSharp
# publishes one, it belongs here, and `install.sh` already knows how to name it.
#
# Windows arrived with W# 0.1.3 and became usable in 0.1.4, which is why
# `WSHARP_VERSION` below is that and not the 0.1.1 the other three were happy
# with. The toolchain this job downloads has to exist for the machine it runs
# on -- and 0.1.3's did exist and did not work: its collector found no roots on
# Windows, so the `sharpie.exe` it built segfaulted on `sharpie version`.
#
# The toolchain is downloaded rather than built, for `ci.yml`'s reason: a
# release of a version manager should be built by the compiler its own users
# have, and building the compiler from source here would test one nobody has.

name: Release

on:
  push:
    tags:
      # `v0.1.0`, and `v0.1.0-rc1` for a pre-release. Anything without the `v`
      # is left alone, so a tag can still be used for something else.
      - "v*"
  # So a release can be retried without deleting and re-pushing a tag. A tag
  # that has to be moved to fix a workflow is a tag that means two things.
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing tag to build and publish, e.g. v0.1.0"
        required: true

# What `softprops/action-gh-release` needs to create the release and attach to
# it. The token is minted for the run; there is no secret to configure.
permissions:
  contents: write

env:
  WSHARP_VERSION: "0.1.4"
  # The tag being released, however this run was started. On a tag push
  # `github.ref_name` *is* the tag; on a manual run it is the branch, which is
  # never what should be packaged, so the input wins.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: ${{ matrix.triple }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One target's failure must not cancel the others: a macOS runner having
      # a bad day should not cost the Linux tarball.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            exe: ""
            cc: cc
            sha: sha256sum
          - os: macos-latest
            triple: aarch64-apple-darwin
            exe: ""
            cc: cc
            sha: shasum -a 256
          # `macos-13` was the Intel image and was retired in December 2025;
          # a job asking for it is never claimed and queues until it times out.
          # `macos-15-intel` is the replacement label.
          - os: macos-15-intel
            triple: x86_64-apple-darwin
            exe: ""
            cc: cc
            sha: shasum -a 256
          # **`.exe` is not decoration here.** Windows decides whether a file
          # can be run by its name, `wsharp build -o` writes exactly the name it
          # is given, and `sharpie init` looks for `sharpie.exe`. Every step
          # below that names the binary has to carry it, and so does
          # `install.sh` and `install.ps1` at the far end.
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            exe: ".exe"
            # Not `cc`: `wsharp` drives the link itself and passes `-o`, which
            # `cl.exe` does not understand. clang is on the hosted image and
            # drives `link.exe` underneath. WSharp's own release workflow says
            # the same thing for the same reason.
            cc: clang
            sha: sha256sum
    defaults:
      run:
        # Git Bash on Windows, so one script works on all four. Every `run:`
        # below is written for it.
        shell: bash
    env:
      CC: ${{ matrix.cc }}
    steps:
      # The tag, not the branch: a manual re-run must package the same commit
      # the tag names, or it would publish something the tag never pointed at.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # **Git Bash ships a coreutils `link`, and it comes before MSVC's on
      # `PATH`.** clang drives the link by running `link.exe`, so it finds the
      # one that makes hard links instead, and fails talking about operands
      # rather than about linking. Nothing here uses `link(1)`, so the shortest
      # fix is to take it away. WSharp hit this first; sharpie reaches the same
      # linker through `wsharp build`.
      - name: Remove the link.exe that is not a linker
        if: runner.os == 'Windows'
        run: rm -f "/c/Program Files/Git/usr/bin/link.exe"

      # clang finds the MSVC toolchain by itself and the Windows SDK's
      # *libraries* not at all: `LIB` and `INCLUDE` are what `vcvars64.bat`
      # exports, and without them the link cannot resolve `kernel32` and the
      # seven others `wsharp` names. This action is that batch file with its
      # environment hoisted into the job, which is the only way a later `run:`
      # can see it.
      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # **A binary that lies about its version is worse than one that will not
      # say.** `sharpie version` answers from a constant in `src/main.ws`, and
      # nothing forces that constant to have been bumped along with the tag. So
      # it is checked here, before anything is built: a disagreement fails the
      # release rather than shipping a `v0.2.0` that calls itself `0.1.0`.
      - name: The version agrees with the tag
        run: |
          set -eu
          version="${TAG#v}"
          declared=$(sed -n 's/^pub const VERSION = "\(.*\)";$/\1/p' src/main.ws)
          echo "tag ${version}, source ${declared}"
          if [ "$declared" != "$version" ]; then
              echo "src/main.ws says \`${declared}\` and the tag says \`${version}\`" >&2
              echo "bump VERSION in src/main.ws, or tag the commit that has" >&2
              exit 1
          fi

      - name: Bootstrap the W# toolchain
        run: |
          set -eu
          stage="wsharp-${WSHARP_VERSION}-${{ matrix.triple }}"
          base="https://github.com/sinisterMage/WSharp/releases/download/v${WSHARP_VERSION}"
          mkdir -p .wsharp
          curl -fsSL --proto '=https' --tlsv1.2 -o ".wsharp/${stage}.tar.gz" "${base}/${stage}.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o ".wsharp/${stage}.tar.gz.sha256" "${base}/${stage}.tar.gz.sha256"
          cd .wsharp
          want=$(cut -d' ' -f1 < "${stage}.tar.gz.sha256")
          got=$(${{ matrix.sha }} "${stage}.tar.gz" | cut -d' ' -f1)
          [ "$want" = "$got" ] || { echo "the toolchain is not what was published" >&2; exit 1; }
          tar -xzf "${stage}.tar.gz"
          echo "WSHARP=${PWD}/${stage}/wsharp${{ matrix.exe }}" >> "$GITHUB_ENV"

      - name: Versions
        run: |
          "$WSHARP" --version
          "$CC" --version | head -1

      # A tag that cannot pass its own cases is not a release. This repeats what
      # CI already did for the commit, which is the point: a tag can be pushed
      # at any commit, including one CI never saw.
      #
      # The three MSYS switches are `ci.yml`'s, and for the reason it gives at
      # length: a case that sets `SHARPIE_HOME=/tmp/...` has that value
      # translated to a Windows path on the way to a native `wsharp.exe`, and
      # every line it expects drifts. Scoped to this step because the smoke step
      # below wants the translation it turns off.
      - name: Test
        env:
          MSYS_NO_PATHCONV: "1"
          MSYS2_ARG_CONV_EXCL: "*"
          MSYS2_ENV_CONV_EXCL: "*"
        run: ./tests/run.sh

      - name: Build
        run: |
          "$WSHARP" build src/main.ws -o "sharpie${{ matrix.exe }}"

      # What is about to be published, made to do the things it exists to do,
      # on the machine that built it. `init` is the verb `install.sh` runs the
      # moment it has unpacked this binary -- if it does not work here it will
      # not work there, and finding that out from a user's terminal is finding
      # it out too late.
      - name: Smoke
        run: |
          set -eu
          exe="${{ matrix.exe }}"
          got=$("./sharpie${exe}" version)
          echo "$got"
          [ "$got" = "sharpie ${TAG#v}" ] || { echo "built binary reports \`$got\`" >&2; exit 1; }
          "./sharpie${exe}" help > /dev/null

          # **From where `install.sh` puts it**, because `init` writes three
          # proxies and one of them is the file it is running from. A running
          # executable cannot be opened for writing -- `ETXTBSY` -- so doing it
          # in place fails on the first of the three and leaves an installation
          # with no `wsharp` and no `ingot`. Running `./sharpie init` from the
          # build directory would pass while every real install broke.
          #
          # **`pwd -W` on Windows, because `$PWD` is not a path sharpie can
          # read.** Git Bash spells this directory `/d/a/sharpie/sharpie`, which
          # is an MSYS mount and means nothing to a native program:
          # `sharpie.exe` would read the leading `/` as the root of the current
          # drive and make its home at `D:\d\a\...`, while the `test -x` lines
          # below looked at `D:\a\...` and found nothing.
          #
          # MSYS *would* translate `SHARPIE_HOME` here, and correctly -- which is
          # why the switches that turn that off are on the test step above and
          # not on the job. This step does not rely on it either way: what it
          # hands over is already a Windows path.
          here=$PWD
          [ -z "${exe}" ] || here=$(pwd -W)
          home="${here}/.sharpie-smoke"
          mkdir -p "${home}/bin"
          cp "sharpie${exe}" "${home}/bin/sharpie${exe}"
          SHARPIE_HOME="$home" "${home}/bin/sharpie${exe}" init
          test -x "${home}/bin/wsharp${exe}"
          test -x "${home}/bin/ingot${exe}"

          # Idempotent, which is how upgrading refreshes the proxies -- and on
          # Windows this second run is the whole question rather than a
          # repetition of the first. `rename` there is `MoveFileEx` with
          # `MOVEFILE_REPLACE_EXISTING`, which has to *delete* what it replaces,
          # and Windows will not delete a running image. So the proxy that is
          # doing the writing is the one that cannot be written, and `init`
          # falls back to moving the old file aside. If that were wrong, this
          # line is where it would say so.
          SHARPIE_HOME="$home" "${home}/bin/sharpie${exe}" init > /dev/null
          test -x "${home}/bin/wsharp${exe}"
          # And what it left behind still runs, which is the half a failed
          # replace would take away.
          SHARPIE_HOME="$home" "${home}/bin/sharpie${exe}" version

          # The proxies are copies of this binary, so one of them can be asked
          # the manager's own questions and must answer them.
          SHARPIE_HOME="$home" "${home}/bin/sharpie${exe}" show || true

      # **One binary, and no `lib/`.** That is the difference between packaging
      # sharpie and packaging the toolchain it installs: `wsharp` links and so
      # needs its runtime archive beside it, but sharpie is what `wsharp build`
      # *produced* -- the archive is already linked in. So a release is one
      # executable, and `install.sh` copies exactly that one file.
      #
      # The checksum is a per-target sidecar rather than a shared `SHA256SUMS`,
      # because four matrix jobs writing one file would each overwrite the
      # others. `install.sh` wants one tarball and one digest anyway.
      - name: Package
        run: |
          set -eu
          version="${TAG#v}"
          stage="sharpie-${version}-${{ matrix.triple }}"
          mkdir -p "dist/${stage}"
          cp "sharpie${{ matrix.exe }}" "dist/${stage}/"
          cp README.md LICENSE "dist/${stage}/"
          tar -czf "dist/${stage}.tar.gz" -C dist "${stage}"
          rm -r "dist/${stage}"
          cd dist
          ${{ matrix.sha }} "${stage}.tar.gz" > "${stage}.tar.gz.sha256"
          ls -l
          cat "${stage}.tar.gz.sha256"

      # Creates the release at this tag if it is not there yet and attaches
      # this target's two files. Every matrix job does the same, so the four
      # converge on one release holding eight assets.
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          # Named explicitly, because on a manual run the default is the ref --
          # which is the branch, and would attach these to a release called
          # `main`.
          tag_name: ${{ env.TAG }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          # `v0.1.0-rc1` is a pre-release and `v0.1.0` is not: the hyphen is
          # what semver already uses to say so.
          prerelease: ${{ contains(env.TAG, '-') }}
          fail_on_unmatched_files: true
